name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 Release (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

      - name: Check types
        run: npm run typecheck

      - name: Build Windows installer & portable
        run: npm run dist:win

      - name: Verify serial component inside packaged app
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & .\node_modules\electron\dist\electron.exe scripts\serial-package-smoke.cjs

      - name: List built files
        run: dir release
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: moqi-windows
          path: |
            release/MOQI-*-Setup.exe
            release/MOQI-*-Portable.exe
            release/MOQI-*-Setup.exe.blockmap
            release/latest.yml

      - name: Create / Update Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MOQI-*-Setup.exe
            release/MOQI-*-Portable.exe
            release/MOQI-*-Setup.exe.blockmap
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build Intel and Apple Silicon packages
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: moqi-macos
          path: |
            release/MOQI-*.dmg
            release/MOQI-*.zip
            release/MOQI-*.blockmap
            release/latest-mac.yml
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MOQI-*.dmg
            release/MOQI-*.zip
            release/MOQI-*.blockmap
            release/latest-mac.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (可选)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build && npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: moqi-linux
          path: |
            release/*.AppImage
            release/*.deb
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
